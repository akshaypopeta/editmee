    <script>
      // Production Error Safety, Diagnostics & Mobile Compatibility Layer for EditMee
      (function() {
        if (typeof window !== 'undefined') {
          console.info('[EditMee] boot:start');
          window.__editMeeMounted = false;
          window.__editMeeStage = 'HTML_INIT';

          // Diagnostic store for complete transparent error tracing
          window.__editMeeDiagnostics = {
            stage: 'HTML_INIT',
            startTime: Date.now(),
            requests: [],
            failedRequests: [],
            errors: [],
            lastRequest: null
          };

          // Wrap window.fetch to monitor every network request and record failures
          if (typeof window.fetch === 'function') {
            var origFetch = window.fetch;
            window.fetch = function(input, init) {
              var url = typeof input === 'string' ? input : (input && input.url) || String(input);

              var reqInfo = { url: url, method: method, time: Date.now(), status: null, ok: null };
              window.__editMeeDiagnostics.lastRequest = reqInfo;
              window.__editMeeDiagnostics.requests.push(reqInfo);
              if (window.__editMeeDiagnostics.requests.length > 20) {
                window.__editMeeDiagnostics.requests.shift();
              }

              return origFetch.apply(this, arguments).then(function(res) {
                reqInfo.status = res.status;
                reqInfo.ok = res.ok;
                return res;
              }).catch(function(err) {
                reqInfo.status = 'NETWORK_ERROR';
                reqInfo.error = err && (err.message || String(err));
                window.__editMeeDiagnostics.failedRequests.push(reqInfo);
                console.warn('[EditMee] Monitored fetch failure:', url, err);
                throw err;
              });
            };
          }

          window.__markEditMeeLoaded = function() {
            window.__editMeeMounted = true;
            window.__editMeeStage = 'BOOT_COMPLETE';
            try {
              sessionStorage.removeItem('__editmee_auto_reload_v2');
              sessionStorage.removeItem('__editmee_stale_chunk_refresh__');
            } catch (e) {}
          };

          // Automated self-healing reload that bypasses mobile browser disk cache
          window.__autoRecoverLatestVersion = function() {
            try {
              var KEY = '__editmee_auto_reload_v2';
              var count = parseInt(sessionStorage.getItem(KEY) || '0', 10);
              if (count < 2) {
                sessionStorage.setItem(KEY, String(count + 1));
                var url = new URL(window.location.href);
                url.searchParams.set('_v', Date.now().toString());
                window.location.replace(url.toString());
                return true;
              }
            } catch (e) {}
            return false;
          };

          // Display authentic diagnostic UI with complete technical details instead of generic error masking
          window.__showEditMeeFallback = function(info) {
            if (window.__editMeeMounted) return;
            var details = typeof info === 'object' && info !== null ? info : { message: String(info || 'Unknown startup error') };
            var stage = details.stage || window.__editMeeStage || 'APPLICATION_INITIALIZATION';
            var errorMsg = details.message || (details.error && (details.error.message || String(details.error))) || 'Unknown startup error';
            var stack = (details.error && details.error.stack) || details.stack || '';
            var lastReq = window.__editMeeDiagnostics && window.__editMeeDiagnostics.lastRequest;
            var reqStr = lastReq ? (lastReq.method + ' ' + lastReq.url + ' (' + (lastReq.status || 'pending') + ')') : (details.request || 'None');

            window.__editMeeDiagnostics.errors.push({
              stage: stage,
              error: errorMsg,
              stack: stack,
              request: reqStr,
              time: Date.now()
            });

            var loadingEl = document.getElementById('editmee-boot-loading');
            var fallbackEl = document.getElementById('editmee-boot-fallback');
            if (loadingEl) loadingEl.style.display = 'none';
            if (fallbackEl) {
              fallbackEl.style.display = 'flex';
              var stageEl = document.getElementById('diag-stage');
              var errorEl = document.getElementById('diag-error');
              var requestEl = document.getElementById('diag-request');
              var statusEl = document.getElementById('diag-status');
              var detailsEl = document.getElementById('diag-details');

              if (stageEl) stageEl.textContent = stage;
              if (errorEl) errorEl.textContent = errorMsg;
              if (requestEl) requestEl.textContent = lastReq ? (lastReq.method + ' ' + lastReq.url) : (details.request || 'None');
              if (statusEl) statusEl.textContent = lastReq ? String(lastReq.status || 'Error') : 'N/A';
              if (detailsEl) {
                var diagReport = {
                  stage: stage,
                  error: errorMsg,
                  request: reqStr,
                  timestamp: new Date().toISOString(),
                  userAgent: navigator.userAgent,
                  viewport: window.innerWidth + 'x' + window.innerHeight,
                  failedRequests: (window.__editMeeDiagnostics && window.__editMeeDiagnostics.failedRequests) || [],
                  stack: stack || undefined
                };
                detailsEl.textContent = JSON.stringify(diagReport, null, 2);
              }
            }
          };

          // Safe network status indicator: does NOT abort React loading, only shows notice if connection is slow
          setTimeout(function() {
            if (!window.__editMeeMounted) {
              var slowNotice = document.getElementById('editmee-slow-notice');
              if (slowNotice) slowNotice.style.display = 'block';
            }
          }, 8000);

          // WASM & threading environment detection (SharedArrayBuffer absent on mobile Safari)
          if (typeof window.crossOriginIsolated === 'undefined') {
            window.crossOriginIsolated = false;
          }

          // Global environment object fallback (globalThis for older browsers)
          if (typeof globalThis === 'undefined') {
            window.globalThis = window;
          }
          if (!window.global) {
            window.global = window;
          }
          if (!window.DOMMatrix && window.WebKitCSSMatrix) {
            window.DOMMatrix = window.WebKitCSSMatrix;
          }

          // queueMicrotask fallback for older browsers
          if (typeof window.queueMicrotask !== 'function') {
            window.queueMicrotask = function(fn) {
              Promise.resolve().then(fn).catch(function(err) {
                setTimeout(function() { throw err; }, 0);
              });
            };
          }

          // Promise.allSettled polyfill for older browsers (< 2020)
          if (!Promise.allSettled) {
            Promise.allSettled = function(promises) {
              return Promise.all(
                Array.from(promises).map(function(p) {
                  return Promise.resolve(p).then(
                    function(v) { return { status: 'fulfilled', value: v }; },
                    function(e) { return { status: 'rejected', reason: e }; }
                  );
                })
              );
            };
          }

          if (!Object.fromEntries) {
            Object.fromEntries = function(entries) {
              var obj = {};
              if (!entries) return obj;
              var iter = Array.from(entries);
              for (var i = 0; i < iter.length; i++) {
                var pair = iter[i];
                if (pair && pair.length >= 2) {
                  obj[pair[0]] = pair[1];
                }
              }
              return obj;
            };
          }

          // Array.prototype.flat & flatMap polyfills for older browsers (< 2019)
          if (!Array.prototype.flat) {
            Array.prototype.flat = function(depth) {
              var d = depth === undefined ? 1 : Math.floor(depth);
              if (d < 1) return Array.prototype.slice.call(this);
              return (function flatten(arr, currentDepth) {
                return arr.reduce(function(acc, val) {
                  return acc.concat(Array.isArray(val) && currentDepth > 0 ? flatten(val, currentDepth - 1) : val);
                }, []);
              })(this, d);
            };
          }
          if (!Array.prototype.flatMap) {
            Array.prototype.flatMap = function(cb, thisArg) {
              return Array.prototype.map.call(this, cb, thisArg).flat();
            };
          }

          // String.prototype.replaceAll polyfill for older browsers (< 2021)

              if (search instanceof RegExp) {
                if (!search.global) throw new TypeError('replaceAll must be called with a global RegExp');

              }
              return this.split(search).join(replacement);
            };
          }

          // crypto.randomUUID polyfill for iOS < 15.4 / older WebKit
          if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
            crypto.randomUUID = function() {
              return ('10000000-1000-4000-8000-100000000000').replace(/[018]/g, function(c) {
                var num = Number(c);
                return (num ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (num / 4)))).toString(16);
              });
            };
          }

          // Array.prototype.at polyfill for iOS < 15.4
          if (!Array.prototype.at) {
            Array.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }

          // String.prototype.at polyfill for iOS < 15.4
          if (!String.prototype.at) {
            String.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return '';
              return this.charAt(n);
            };
          }

          // Object.hasOwn polyfill for iOS < 15.4
          if (!Object.hasOwn) {
            Object.hasOwn = function(obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }

          // structuredClone polyfill for iOS < 15.4
          if (!window.structuredClone) {
            window.structuredClone = function(obj) {
              if (obj === undefined) return undefined;
              try {
                return JSON.parse(JSON.stringify(obj));
              } catch (e) {
                return obj;
              }
            };
          }

          // requestIdleCallback polyfill for iOS < 16.4
          if (!window.requestIdleCallback) {
            window.requestIdleCallback = function(cb) {
              return setTimeout(function() {
                cb({ didTimeout: false, timeRemaining: function() { return Math.max(0, 50); } });
              }, 1);
            };
            window.cancelIdleCallback = function(id) {
              clearTimeout(id);
            };
          }

          // requestAnimationFrame fallback
          if (!window.requestAnimationFrame) {
            window.requestAnimationFrame = function(cb) {
              return setTimeout(function() { cb(Date.now()); }, 16);
            };
          }
          if (!window.cancelAnimationFrame) {
            window.cancelAnimationFrame = function(id) {
              clearTimeout(id);
            };
          }

          // matchMedia fallback
          if (!window.matchMedia) {
            window.matchMedia = function() {
              return {
                matches: false,
                media: '',
                onchange: null,
                addListener: function() {},
                removeListener: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
            };
          }

          // IntersectionObserver fallback
          if (!window.IntersectionObserver) {
            window.IntersectionObserver = function() {
              return {
                observe: function() {},
                unobserve: function() {},
                disconnect: function() {},
                takeRecords: function() { return []; }
              };
            };
          }

          // BroadcastChannel fallback
          if (!window.BroadcastChannel) {
            window.BroadcastChannel = function() {
              return {
                name: '',
                postMessage: function() {},
                close: function() {},
                onmessage: null,
                onmessageerror: null,
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
            };
          }

          // Resilient Clipboard API with automatic fallback for mobile Safari & iframe contexts
          if (typeof navigator !== 'undefined') {
            var legacyCopy = function(text) {
              return new Promise(function(resolve, reject) {
                try {
                  var textArea = document.createElement('textarea');
                  textArea.value = text;
                  textArea.style.position = 'fixed';
                  textArea.style.top = '-9999px';
                  textArea.style.left = '-9999px';
                  textArea.setAttribute('readonly', '');
                  document.body.appendChild(textArea);
                  textArea.focus();
                  textArea.select();
                  var successful = false;
                  try {
                    successful = document.execCommand('copy');
                  } catch (cmdErr) {
                    successful = false;
                  }
                  document.body.removeChild(textArea);
                  if (successful) resolve();
                  else reject(new Error('copy command unsuccessful'));
                } catch (err) {
                  reject(err);
                }
              });
            };

            if (!navigator.clipboard) {
              navigator.clipboard = {
                writeText: function(text) { return legacyCopy(text); },
                readText: function() { return Promise.resolve(''); }
              };
            } else {
              var origWrite = navigator.clipboard.writeText;
              navigator.clipboard.writeText = function(text) {
                try {
                  return origWrite.call(navigator.clipboard, text).catch(function(err) {
                    console.warn('[EditMee] Async clipboard rejected, attempting legacy copy fallback:', err);
                    return legacyCopy(text);
                  });
                } catch (err) {
                  console.warn('[EditMee] Async clipboard threw synchronously, attempting legacy copy fallback:', err);
                  return legacyCopy(text);
                }
              };
            }
          }

          // ResizeObserver fallback with debounce and proper cleanup
          if (!window.ResizeObserver) {
            window.ResizeObserver = function(callback) {
              var observedElements = [];
              var rafId = null;

                if (observedElements.length === 0) return;

                  var el = observedElements[i];
                  try {
                    var rect = el.getBoundingClientRect();
                    entries.push({ target: el, contentRect: rect });
                  } catch (e) {}
                }
                if (entries.length > 0) {
                  try { callback(entries); } catch (e) {}
                }
              };
              var onResize = function() {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(check);
              };
              return {
                observe: function(elem) {
                  if (elem && observedElements.indexOf(elem) === -1) {
                    observedElements.push(elem);
                    if (observedElements.length === 1) {
                      window.addEventListener('resize', onResize, { passive: true });
                    }
                  }
                },
                unobserve: function(elem) {
                  var idx = observedElements.indexOf(elem);
                  if (idx !== -1) {
                    observedElements.splice(idx, 1);
                    if (observedElements.length === 0) {
                      window.removeEventListener('resize', onResize);
                    }
                  }
                },
                disconnect: function() {
                  observedElements = [];
                  window.removeEventListener('resize', onResize);
                  if (rafId) cancelAnimationFrame(rafId);
                }
              };
            };
          }

          // Safe storage prototype interception & memory fallback for WebKit / Safari Private Browsing
          (function() {
            var memoryStore = {};
            try {
              var testKey = '__editmee_st_probe__';
              window.localStorage.setItem(testKey, '1');
              window.localStorage.removeItem(testKey);
            } catch (e) {
              console.warn('[EditMee] storage:error Native storage restricted, activating memory fallback');
            }

            // Patch Storage.prototype to guarantee zero unhandled DOMException / SecurityError crashes
            if (typeof window !== 'undefined' && window.Storage && window.Storage.prototype) {
              var origSet = window.Storage.prototype.setItem;
              var origGet = window.Storage.prototype.getItem;
              var origRem = window.Storage.prototype.removeItem;
              var origClr = window.Storage.prototype.clear;

              window.Storage.prototype.setItem = function(key, val) {
                var sKey = String(key);
                var sVal = String(val);
                try {
                  origSet.call(this, sKey, sVal);
                } catch (err) {
                  memoryStore[sKey] = sVal;
                }
              };

              window.Storage.prototype.getItem = function(key) {
                var sKey = String(key);
                try {
                  var res = origGet.call(this, sKey);
                  if (res !== null) return res;
                } catch (err) {}
                return Object.prototype.hasOwnProperty.call(memoryStore, sKey) ? memoryStore[sKey] : null;
              };

              window.Storage.prototype.removeItem = function(key) {
                var sKey = String(key);
                try {
                  origRem.call(this, sKey);
                } catch (err) {}
                delete memoryStore[sKey];
              };

              window.Storage.prototype.clear = function() {
                try {
                  origClr.call(this);
                } catch (err) {}
                memoryStore = {};
              };
            }

            // Safe IndexedDB guard for private browsing mode
            try {
              if (typeof window !== 'undefined' && !window.indexedDB) {
                window.indexedDB = null;
              }
            } catch (idbErr) {}
          })();

          // Vite Stale Chunk Handler: Detects outdated chunk references and safely performs a cache-busting refresh
          window.addEventListener('vite:preloadError', function(event) {
            console.warn('[EditMee] chunk:error', event);
            if (event && event.preventDefault) event.preventDefault();
            if (typeof window.__autoRecoverLatestVersion === 'function') {
              var recovered = window.__autoRecoverLatestVersion();
              if (recovered) return;
            }
            window.__showEditMeeFallback({ stage: 'CHUNK_PRELOAD_ERROR', message: 'Failed to preload required module chunk', error: event });
          });

          // Global unhandled error listener: catch fatal bundle load/parse crashes and auto-recover
          window.addEventListener('error', function(event) {
            console.warn('[EditMee] boot:error', event && (event.error || event.message));
            var msg = (event && (event.message || (event.error && event.error.message))) || '';

            // Discard harmless resource errors (img, link, audio, video) and benign browser resize loop notifications
            if (event.target && event.target !== window && (event.target.tagName === 'IMG' || event.target.tagName === 'LINK' || event.target.tagName === 'AUDIO' || event.target.tagName === 'VIDEO')) {
              return;
            }
            if (msg.indexOf('ResizeObserver loop') !== -1) {
              return;
            }

            // Chunk and dynamic module load failure auto-recovery
            if (
              msg.indexOf('Loading chunk') !== -1 ||
              msg.indexOf('dynamically imported module') !== -1 ||
              msg.indexOf('module script failed') !== -1
            ) {
              if (typeof window.__autoRecoverLatestVersion === 'function') {
                var recovered = window.__autoRecoverLatestVersion();
                if (recovered) return;
              }
            }

            // Universal pre-mount crash guard: if React has not mounted, show diagnostic UI with exact details
            if (!window.__editMeeMounted) {
              window.__showEditMeeFallback({
                stage: window.__editMeeStage || 'SCRIPT_EXECUTION',
                message: msg || 'Script execution error',
                error: event.error,
                request: event.filename ? (event.filename + ':' + event.lineno + ':' + event.colno) : undefined

            }
          }, true);

          // Handle unhandled promise rejections on window load with auto-recovery for failed dynamic imports
          window.addEventListener('unhandledrejection', function(event) {
            console.warn('[EditMee] boot:error unhandledrejection', event && event.reason);
            var reason = event && event.reason;
            var reasonMsg = (reason && (reason.message || String(reason))) || '';

            // Non-fatal background network/fetch rejections MUST NEVER abort the application shell
            if (reasonMsg.indexOf('Failed to fetch') !== -1 || reasonMsg.indexOf('NetworkError') !== -1) {
              console.warn('[EditMee] Background fetch error (non-fatal, continuing UI render):', reasonMsg);
              if (event && event.preventDefault) event.preventDefault();
              return;
            }

            if (!window.__editMeeMounted) {
              if (
                reasonMsg.indexOf('Loading chunk') !== -1 ||
                reasonMsg.indexOf('dynamically imported module') !== -1 ||
                reasonMsg.indexOf('Importing a module script failed') !== -1
              ) {
                if (typeof window.__autoRecoverLatestVersion === 'function') {
                  var recovered = window.__autoRecoverLatestVersion();
                  if (recovered) return;
                }
                window.__showEditMeeFallback({
                  stage: 'DYNAMIC_IMPORT_FAILURE',
                  message: reasonMsg,
                  error: reason
                });
              }
            }

            if (event && event.preventDefault) {
              event.preventDefault();
            }
          });
        }

        // Cleanup broken/stale legacy service workers if any exist
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {

              }
            }).catch(function() {});
          } catch (e) {}
        }

        // Purge obsolete Cache Storage instances from previous deployments
        if (typeof window !== 'undefined' && 'caches' in window) {
          try {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          } catch (e) {}
        }
      })();
